name: Security and Build Check

on:
  push:
    branches: [main, scalability-hardening]
  pull_request:
    branches: [main]

jobs:
  security-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: anarock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: anarock/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
